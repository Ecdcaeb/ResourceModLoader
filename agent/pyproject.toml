[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rml-agent"
version = "0.1.0"
description = "Server-hosted ADK agent and terminal client for ResourceModLoader"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]==2.14.1",
    "litellm==1.102.1",
    "httpx>=0.28,<0.29",
    "prompt-toolkit==3.0.53",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
rml-agent = "rml_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
