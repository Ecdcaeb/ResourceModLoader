site_name: ResourceModLoader
site_description: Official documentation for ResourceModLoader
site_url: https://ecdcaeb.github.io/ResourceModLoader/
repo_url: https://github.com/Ecdcaeb/ResourceModLoader
repo_name: Ecdcaeb/ResourceModLoader

docs_dir: docs
site_dir: build/docs-site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info

strict: true

nav:
  - 首页: index.md
  - 中文:
      - 资源模载器: zh_cn/index.md
      - 主元: zh_cn/0_主元.md
      - 开始: zh_cn/1_开始.md
      - 模块:
